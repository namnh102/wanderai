name: W07 Trusted Publication Boundary Gate (develop)

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  w07-trusted-publication-gate:
    name: w07-trusted-publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_classification: ${{ steps.gate.outputs.pr_classification }}
      w07_release_approved: ${{ steps.gate.outputs.w07_release_approved }}
    steps:
      - name: Checkout ONLY trusted protected develop base (NEVER checkout PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage trusted verifier outside workspace & fetch inert PR git objects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted_verifier"
          cp "${GITHUB_WORKSPACE}/scripts/check_w07_public_release_denylist.py" \
             "${RUNNER_TEMP}/trusted_verifier/w07_trusted_publication_verifier_v1.py"
          git -C "${GITHUB_WORKSPACE}" fetch --no-tags "${{ github.server_url }}/${{ github.repository }}.git" "${CANDIDATE_SHA}"
          # Verify working tree is still strictly at trusted BASE_SHA (zero PR files checked out)
          test "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" = "${BASE_SHA}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run external trusted verifier on inert PR git objects (PUB-R1-TRUST-01..03)
        id: gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          SIGNED_APPROVAL_V2_JSON: ${{ vars.W07_OWNER_SIGNED_PUBLIC_RELEASE_APPROVAL_V2_JSON }}
        run: |
          set -euo pipefail
          APPROVAL_ARGS=()
          if [ -n "${SIGNED_APPROVAL_V2_JSON}" ]; then
            APPROVAL_FILE="${RUNNER_TEMP}/w07_owner_signed_approval_v2.json"
            printf '%s\n' "${SIGNED_APPROVAL_V2_JSON}" > "${APPROVAL_FILE}"
            APPROVAL_ARGS=(--trusted-owner-approval-json "${APPROVAL_FILE}")
          fi
          OUT_JSON="${RUNNER_TEMP}/gate_report.json"
          python -B -W error "${RUNNER_TEMP}/trusted_verifier/w07_trusted_publication_verifier_v1.py" \
            --root "${GITHUB_WORKSPACE}" \
            --ci-pr-gate \
            --require-external-trusted-verifier \
            --git-objects-only \
            --git-diff-base "${BASE_SHA}" \
            --candidate-commit-ref "${CANDIDATE_SHA}" \
            --require-owner-approval \
            "${APPROVAL_ARGS[@]}" | tee "${OUT_JSON}"
          python -B -W error - <<'PY'
          import json
          import os
          import pathlib

          report_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gate_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          pr_cls = str(report.get("pr_classification", "")).strip()
          if "\n" in pr_cls or "\r" in pr_cls:
              raise ValueError("Invalid newline in pr_classification")
          approved_str = "true" if (report.get("w07_release_approved") is True) else "false"
          out_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out_path.open("a", encoding="utf-8") as fh:
              fh.write(f"pr_classification={pr_cls}\n")
              fh.write(f"w07_release_approved={approved_str}\n")
          PY

  w07-tier1-synthetic-suite:
    name: w07-tier1-synthetic-suite
    needs: [w07-trusted-publication-gate]
    if: needs.w07-trusted-publication-gate.outputs.w07_release_approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verified Owner-approved W07 candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Tier-1 Public-Safe Synthetic & Adversarial Suite (0 API / 0 Private Data)
        run: |
          python -B -W error tests/test_w07_key_pin_migration_public_ci.py

name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mandatory CI never calls Gemini/OpenAI and needs no PostgreSQL/Redis.
# Tests that need those are listed explicitly as BLOCKED_BY_ENVIRONMENT below.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck
      - run: pnpm run lint:check
      - run: pnpm run build
      # Backend e2e specs need PostgreSQL: BLOCKED_BY_ENVIRONMENT in mandatory CI.

  ai-service:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: dummy-key-not-used-in-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - run: pip install -r apps/ai-service/requirements-dev.txt
      - run: ruff check .
      - run: python scripts/export_openapi_ai.py --check
      - name: AI service tests (offline)
        working-directory: apps/ai-service
        run: >
          python -m pytest tests -q
          --deselect tests/test_rag.py::test_rag_retrieval_da_nang_culinary
          --deselect tests/test_grounding_contract.py::test_synthetic_documents_never_reach_the_provider
        # The two deselected tests need PostgreSQL: BLOCKED_BY_ENVIRONMENT.

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  data-contract:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: dummy-key-not-used-in-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-data-contract.txt
      - name: Freeze V1/V2 checksum verification (restricted ViHoRec data is git-ignored)
        run: python -m scripts.freeze_checksum --skip-missing-prefix=data/restricted/
      - name: Data / REC-A contract tests
        # Deselected tests are BLOCKED_BY_ENVIRONMENT: they need the git-ignored licensed
        # ViHoRec files (covered above by the CLI step for every tracked artifact) or a live DB.
        run: >
          python -m pytest tests -q
          --deselect tests/test_data02_contract.py::test_vihorec_integrity_pass
          --deselect tests/test_data02_contract.py::test_freeze_manifest_sha256_integrity
          --deselect tests/test_data03_danang_freeze_v2.py::test_freeze_v1_immutability
          --deselect tests/test_data03_danang_freeze_v2.py::test_freeze_v2_checksum_integrity
          --deselect tests/test_data03_danang_freeze_v2.py::test_live_database_invariants
          --deselect tests/test_data04_lineage_r1.py::test_assertion_14_freeze_v1_sha_integrity
          --deselect tests/test_freeze_checksum_compat.py::test_real_freeze_v1_verification_reports_statuses
          --deselect tests/test_reca_baseline.py::test_assertion_12_freeze_v1_and_v2_sha_integrity

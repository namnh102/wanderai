    url: https://overpass-api.de/api/interpreter
    raw_path: data/raw/osm_vietnam_sample.json
    processed_path: data/processed/osm_places.json
    curated_path: data/curated/places_canonical.json
    license: ODbL (Open Database License 1.0)
    permitted_usage: "Search, Map, Route planning, Recommendations, Geocoding"
    storage_permission: true
    redistribution_restriction: "Attribution required (© OpenStreetMap contributors). Share-Alike on derivative databases."
    collection_method: "Overpass API spatial query filtering Vietnam bounding box with tourism, amenity, historic tags"
    collection_date: "2026-10-01"
    transformation: "Raw node/way JSON -> tag extraction -> category mapping -> coordinate validation -> entity resolution"
    generated: false
    trusted: true
    notes: "Primary authoritative source for real Vietnamese travel POIs, accurate GPS coordinates, and street addresses."


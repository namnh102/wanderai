# Data Sources Manifest — WanderAI (GoMate)
# Full data provenance, licensing, and compliance registry

version: "1.0"
last_updated: "2026-10-01"

sources:
  - name: synthetic_destinations
    type: synthetic
    path: data/seed/synthetic_destinations.json
    records: 50
    generated: true
    trusted: false
    source: AI-generated
    license: N/A
    permitted_usage: "Internal UI layout testing and schema prototyping only"
    storage_permission: true
    redistribution_restriction: "Do not distribute as real-world data"
    collection_method: "Pre-generated LLM sample"
    collection_date: "2026-09-01"
    transformation: "JSON normalization to Prisma Destination model"
    notes: >
      50 Vietnamese destinations with approximate coordinates.
      Names and provinces are real, but ratings and descriptions are fabricated.
      DO NOT present as verified real-world information.

  - name: synthetic_places
    type: synthetic
    path: data/seed/synthetic_places.json
    records: 56
    generated: true
    trusted: false
    source: AI-generated
    license: N/A
    permitted_usage: "Internal UI layout testing only"
    storage_permission: true
    redistribution_restriction: "Do not distribute as real-world data"
    collection_method: "Pre-generated LLM sample"
    collection_date: "2026-09-01"
    transformation: "JSON normalization to Prisma Place model"
    notes: >
      56 Vietnamese places across ~15 provinces.
      Coordinates are approximate (rounded). Prices are estimated.
      DO NOT present as verified real-world information.

  - name: reference_categories
    type: reference
    path: database/seed/categories.json
    records: 10
    generated: false
    trusted: true
    source: Manual Taxonomy
    license: Open
    permitted_usage: "Taxonomy categorization across all application layers"
    storage_permission: true
    redistribution_restriction: "None"
    collection_method: "Curated application taxonomy"
    collection_date: "2026-09-01"
    transformation: "Direct seed into place_categories table"
    notes: "Base category taxonomy (attraction, restaurant, hotel, beach, mountain, culture, etc.)"

  - name: osm_vietnam_tourism
    type: geographic
    provider: OpenStreetMap Contributors
    api: Overpass API
    url: https://overpass-api.de/api/interpreter
    raw_path: data/raw/osm_vietnam_sample.json
    processed_path: data/processed/osm_places.json
    curated_path: data/curated/places_canonical.json
    license: ODbL (Open Database License 1.0)
    permitted_usage: "Search, Map, Route planning, Recommendations, Geocoding"
    storage_permission: true
    redistribution_restriction: "Attribution required (© OpenStreetMap contributors). Share-Alike on derivative databases."
    collection_method: "Overpass API spatial query filtering Vietnam bounding box with tourism, amenity, historic tags"
    collection_date: "2026-10-01"
    transformation: "Raw node/way JSON -> tag extraction -> category mapping -> coordinate validation -> entity resolution"
    generated: false
    trusted: true
    notes: "Primary authoritative source for real Vietnamese travel POIs, accurate GPS coordinates, and street addresses."

  - name: uit_vsfc_travel_reviews
    type: sentiment_and_reviews
    provider: UIT-VSFC & Mendeley Open Research
    url: https://data.mendeley.com
    raw_path: data/raw/vietnam_travel_reviews.json
    processed_path: data/processed/reviews_normalized.json
    curated_path: data/curated/reviews_curated.json
    license: CC BY 4.0 (Creative Commons Attribution 4.0 International)
    permitted_usage: "Review analysis, sentiment classification, place linking, RAG knowledge indexing"
    storage_permission: true
    redistribution_restriction: "Attribution to original authors required. No additional restrictions."
    collection_method: "Curated academic benchmark dataset of Vietnamese hotel and attraction customer reviews"
    collection_date: "2026-10-01"
    transformation: "Text cleanup -> PII anonymization -> rating normalization (1.0-5.0) -> place entity linking"
    generated: false
    trusted: true
    notes: "Contains authentic Vietnamese traveler reviews for hotels and landmarks across Hanoi, Da Nang, Ho Chi Minh City, Sapa, and Hoi An."

  - name: open_meteo_weather
    type: runtime_api
    provider: Open-Meteo
    url: https://api.open-meteo.com/v1
    license: Free for non-commercial and commercial with attribution (CC BY 4.0)
    permitted_usage: "Real-time weather query in AI Agent tools"
    storage_permission: false
    redistribution_restriction: "Do not cache persistently; query at runtime"
    collection_method: "On-demand REST API query by GPS coordinates"
    collection_date: "Runtime dynamic"
    transformation: "JSON forecast to text summary for LLM context"
    generated: false
    trusted: true
    notes: "Queried on demand by GetWeatherTool for 7-day weather forecasts across Vietnam."
